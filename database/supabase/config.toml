# Supabase local project configuration (Foundation baseline)
# Do not store secrets, service-role keys, or production credentials here.

project_id = "healthcare-lead-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
enable_signup = true
minimum_password_length = 12
enable_manual_linking = false
jwt_expiry = 900

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
